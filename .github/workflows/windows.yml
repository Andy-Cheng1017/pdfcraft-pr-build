name: Build PdfCraft personal fork

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdfcraft-search-experience
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
        working-directory: source
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: "-C target-feature=+crt-static"
      PDFCRAFT_REQUIRE_WINRES: "1"
      CRAFT_FONTS_REQUIRED: "1"
      CRAFT_FONTS_DIR: ${{ github.workspace }}\craft-fonts
      PDFCRAFT_SYSTEM_FONTS: "0"
    steps:
      - name: Check out the fork revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Andy-Cheng1017/pdfcraft
          ref: 8e263baddf66a9bcfb64024cf3760bbc417fc0ed
          path: source
          persist-credentials: false

      - name: Check out the matching open-source fonts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: storytold/craft-fonts
          ref: b076417b5880bd4154bd22f00695b1d28c6bea83
          path: craft-fonts
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default stable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc --version
          cargo --version
          rustup component add rustfmt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Cache compiled dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: source -> target
          key: windows-search-experience

      - name: Check formatting and regenerate attribution
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo xtask assets --write
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload generated attribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: generated-attribution
          path: source\ATTRIBUTION.md
          if-no-files-found: error
          retention-days: 7

      - name: Test selected-text search normalization and anchoring
        run: |
          cargo test --locked --release --target x86_64-pc-windows-msvc -p pdfcraft-ui-egui --lib a_selection_is_a_search_phrase_on_one_line
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --release --target x86_64-pc-windows-msvc -p pdfcraft-ui-egui --lib find_for_a_selection_searches_from_
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test search-result positioning
        run: |
          cargo test --locked --release --target x86_64-pc-windows-msvc -p pdfcraft-ui-egui --lib search_centres_the_match_on_a_rotated_view
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --release --target x86_64-pc-windows-msvc -p pdfcraft-ui-egui --lib a_match_with_unbounded_glyphs_falls_back_to_its_page
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --release --target x86_64-pc-windows-msvc -p pdfcraft-ui-egui --test search_position
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test Ctrl+F selection search end to end
        run: |
          cargo test --locked --release --target x86_64-pc-windows-msvc -p pdfcraft-ui-egui --test it find_shortcut_searches_
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build the desktop application
        run: |
          cargo build --locked --release --target x86_64-pc-windows-msvc -p pdfcraft
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage application and required notices
        run: |
          $ErrorActionPreference = 'Stop'
          $out = New-Item -ItemType Directory -Force dist
          Copy-Item target\x86_64-pc-windows-msvc\release\pdfcraft.exe $out
          foreach ($file in 'LICENSE-MIT', 'LICENSE-APACHE', 'NOTICE', 'ATTRIBUTION.md') {
            Copy-Item $file $out
          }
          Copy-Item assets\app-icon\LICENSE-document.txt $out
          Copy-Item -Recurse licenses (Join-Path $out 'licenses')
          . .\packaging\windows\font-notices.ps1
          $notices = @(Get-CraftFontNotices $env:CRAFT_FONTS_DIR $true)
          foreach ($notice in $notices) {
            Copy-Item -LiteralPath $notice.FullName -Destination (Join-Path $out "OFL-$($notice.Directory.Name).txt")
          }
          @(
            'Unofficial, unsigned Windows x64 test build from the PdfCraft personal fork.'
            'Source: https://github.com/Andy-Cheng1017/pdfcraft/tree/feat/search-experience'
            "Commit: $(git rev-parse HEAD)"
            'Includes selected-text Ctrl+F search and search-result positioning changes.'
            'OCR models are not included. Test with copies of documents.'
            'Extract the entire artifact before launching pdfcraft.exe.'
          ) | Set-Content -Encoding utf8 (Join-Path $out 'BUILD-INFO.txt')
          $hash = Get-FileHash (Join-Path $out 'pdfcraft.exe') -Algorithm SHA256
          "$($hash.Hash)  pdfcraft.exe" | Set-Content -Encoding ascii (Join-Path $out 'SHA256SUMS.txt')

      - name: Upload the tested application
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pdfcraft-search-experience-windows-x64
          path: source\dist\*
          if-no-files-found: error
          retention-days: 7
